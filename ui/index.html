<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Counter</title>
<style>
/* Layout: one calm column. Serif headlines for the story, system sans for the work, grouped inset lists like a native Mac app. */
:root{
  --bg:#f5f5f7; --card:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --sep:rgba(0,0,0,.09); --ring:#e8e8ed; --accent:#0071e3; --good:#248a3d;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#98989d; --faint:#6e6e73;
  --sep:rgba(255,255,255,.1); --ring:#2c2c2e; --accent:#2997ff; --good:#30d158; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
.wrap{max-width:680px;margin:0 auto;padding:44px 24px 72px;display:flex;flex-direction:column;gap:36px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.05;letter-spacing:-.01em;margin:0}
.lede{font-family:var(--serif);font-size:19px;line-height:1.4;color:var(--muted);margin:0;max-width:34em}

/* Summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--card);border-radius:14px;padding:18px 20px}
.ringbox{position:relative;width:64px;height:64px}
.ringbox svg{width:64px;height:64px;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:7}
.ringbox .track{stroke:var(--ring)}
.ringbox .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ringbox span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.sumtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.sumtext b{font-size:15px;font-weight:600}
.next{color:var(--muted)}
.next em{font-style:normal;color:var(--fg)}

/* Note */
.note{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.note p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5}

/* Phases */
.phase{display:flex;flex-direction:column;gap:10px}
.ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px}
.ph-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph-title h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.15;margin:0}
.ph-why{color:var(--muted);margin:0}
.ph-count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.phase.complete .ph-count{color:var(--good);font-weight:600}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden}
label{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start;padding:13px 18px;cursor:default}
/* inset hairline between rows, starting under the text like a native list */
li+li label{background:linear-gradient(var(--sep),var(--sep)) 54px 0/calc(100% - 54px) 1px no-repeat}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.sr:checked+.check{background:var(--accent);border-color:var(--accent)}
.sr:checked+.check::after{opacity:1}
.sr:focus-visible+.check{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.t{font-size:14px}
.n{font-size:13px;color:var(--muted)}
li.done .t{color:var(--faint)}
code{font-family:var(--mono);font-size:.9em}

.foot{font-size:12px;color:var(--faint);text-align:center}
.foot.err{color:#d70015}
@media (prefers-reduced-motion: reduce){.ringbox .val,.check{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="foot">Loading…</p></main>
<script>
(function () {
  var phases = [], done = {}, updated = "", saveTimer = null, saveError = "";
  var app = document.getElementById("app");
  var C = 2 * Math.PI * 28;

  function api() { return window.pywebview && window.pywebview.api; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmt(s) { return esc(s).replace(/\b(MCLR|VDD|VSS|PGC|PGD|RC3\/RC4|E3|E2|Y1|U1–U5|DS3–DS7)\b/g, "<code>$1</code>"); }

  function render() {
    var total = 0, count = 0, next = null, html = "";
    phases.forEach(function (p, i) {
      var pd = p.tasks.filter(function (t) { return done[t.id]; }).length;
      total += p.tasks.length; count += pd;
      var complete = pd === p.tasks.length;
      html += '<section class="phase' + (complete ? " complete" : "") + '"><div class="ph-head"><div class="ph-title"><span class="label">Phase ' + (i + 1) +
        '</span><h2>' + esc(p.title) + '</h2><p class="ph-why">' + esc(p.why) + '</p></div><span class="ph-count">' +
        (complete ? "Complete" : pd + " of " + p.tasks.length) + "</span></div><ul>";
      p.tasks.forEach(function (t) {
        if (!done[t.id] && !next) next = t.t;
        html += '<li class="' + (done[t.id] ? "done" : "") + '"><label><input class="sr" type="checkbox" id="cb-' + t.id + '" data-id="' + t.id + '"' +
          (done[t.id] ? " checked" : "") + '><span class="check" aria-hidden="true"></span><span class="txt"><span class="t">' + fmt(t.t) + "</span>" +
          (t.n ? '<span class="n">' + fmt(t.n) + "</span>" : "") + "</span></label></li>";
      });
      html += "</ul></section>";
    });
    var pct = total ? Math.round(count / total * 100) : 0;
    app.innerHTML =
      '<header><span class="eyebrow">PIC16F73 · Build log</span><h1>Day Counter</h1>' +
      '<p class="lede">A pool-heater circuit board, found on a kitchen counter, rebuilt into a desk counter one pin at a time.</p></header>' +
      '<div class="summary"><div class="ringbox"><svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="val" cx="32" cy="32" r="28" stroke-dasharray="' +
      C + '" stroke-dashoffset="' + (C * (1 - pct / 100)) + '"/></svg><span>' + pct + '%</span></div><div class="sumtext"><b>' + count + " of " + total + ' tasks done</b>' +
      '<span class="next">' + (next ? "Next up: <em>" + fmt(next) + "</em>" : "Every task is done.") + "</span></div></div>" +
      '<div class="note"><span class="label">Build decision</span><p>Version 1 stays on the original board. It already has the display, LED drivers and keypad laid out properly. ' +
      "Keep the PIC where it is, add a real-time clock for time, and save a custom single-board design for version 2.</p></div>" +
      html +
      '<p class="foot' + (saveError ? " err" : "") + '">' + (saveError ? esc(saveError) : updated ? "Saved on this Mac · " + esc(updated) : "Progress saves on this Mac as you check things off.") + "</p>";
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      api().save_progress(done).then(function (r) {
        updated = r.updated; saveError = ""; render();
      }).catch(function () {
        saveError = "Couldn't save progress. Check that your disk isn't full, then try again."; render();
      });
    }, 300);
  }

  app.addEventListener("change", function (e) {
    var id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    if (e.target.checked) done[id] = true; else delete done[id];
    render();
    var again = document.getElementById("cb-" + id);
    if (again) again.focus();
    save();
  });

  function init() {
    api().load_state().then(function (s) {
      phases = s.phases; done = s.done || {}; updated = s.updated || ""; render();
    });
  }

  window.__dayCounterPreview = function (s) { phases = s.phases; done = s.done || {}; updated = s.updated || ""; render(); };
  if (api()) init(); else window.addEventListener("pywebviewready", init);
})();
</script>
</body>
</html>
