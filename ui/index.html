<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Counter Plan</title>
<style>
/* Layout: one narrow column of build phases, each a numbered stage with a progress meter */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --fg:#17201a; --muted:#5d6a60; --line:#d6ddd5;
  --mask:#1f5a3a; --copper:#b0672a; --done:#2f7d4f; --track:#e2e8e1;
  --display:"Avenir Next Condensed","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",Menlo,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1712; --panel:#16211a; --fg:#e4ebe5; --muted:#93a396; --line:#2a3a2f;
  --mask:#6fbf8f; --copper:#e0975a; --done:#6fbf8f; --track:#233128; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-user-select:none;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--copper)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,44px);line-height:1;margin:0}
.sub{color:var(--muted);margin:0;max-width:62ch}
.overall{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--done);transition:width .3s}
.decision{border:1px solid var(--line);border-left:4px solid var(--copper);background:var(--panel);padding:16px;border-radius:6px;display:flex;flex-direction:column;gap:6px}
.decision b{font-family:var(--display);font-size:19px}
.decision p{margin:0;color:var(--muted)}
.phase{display:flex;flex-direction:column;gap:10px}
.ph-head{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ph-num{font-family:var(--mono);font-weight:600;color:var(--mask);font-size:13px}
.ph-title{font-family:var(--display);font-weight:600;font-size:23px;margin:0;line-height:1.1}
.ph-count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-why{margin:0;color:var(--muted);font-size:14px}
.phase.complete .ph-num{color:var(--done)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li label{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 6px;border-radius:6px;cursor:default;align-items:start}
li label:hover{background:var(--panel)}
input[type=checkbox]{width:17px;height:17px;margin:3px 0 0;accent-color:var(--done)}
input[type=checkbox]:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.t{min-width:0}
.t span{display:block}
.t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
li.done .t span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
code{font-family:var(--mono);font-size:.86em;background:var(--track);padding:1px 4px;border-radius:3px}
.foot{font-family:var(--mono);font-size:11px;color:var(--muted)}
.foot.err{color:var(--copper)}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="foot">Loading your plan…</p></main>
<script>
(function () {
  var phases = [], done = {}, updated = "", saveTimer = null, saveError = "";
  var app = document.getElementById("app");

  function api() { return window.pywebview && window.pywebview.api; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmt(s) { return esc(s).replace(/\b(MCLR|VDD|VSS|PGC|PGD|RC3\/RC4|E3|E2|Y1|U1–U5|DS3–DS7)\b/g, "<code>$1</code>"); }

  function render() {
    var total = 0, count = 0, html = "";
    phases.forEach(function (p, i) {
      var pd = p.tasks.filter(function (t) { return done[t.id]; }).length;
      total += p.tasks.length; count += pd;
      html += '<section class="phase' + (pd === p.tasks.length ? " complete" : "") + '"><div class="ph-head"><span class="ph-num">' +
        String(i + 1).padStart(2, "0") + '</span><h2 class="ph-title">' + esc(p.title) + '</h2><span class="ph-count">' + pd + "/" + p.tasks.length +
        '</span></div><p class="ph-why">' + esc(p.why) + "</p><ul>";
      p.tasks.forEach(function (t) {
        html += '<li class="' + (done[t.id] ? "done" : "") + '"><label><input type="checkbox" id="cb-' + t.id + '" data-id="' + t.id + '"' +
          (done[t.id] ? " checked" : "") + '><span class="t"><span>' + fmt(t.t) + "</span>" + (t.n ? "<small>" + fmt(t.n) + "</small>" : "") + "</span></label></li>";
      });
      html += "</ul></section>";
    });
    var pct = total ? Math.round(count / total * 100) : 0;
    app.innerHTML =
      '<header><span class="eyebrow">PIC16F73 · Hayward / Emerson board</span><h1>Day Counter Build Plan</h1>' +
      '<p class="sub">From a found pool-heater board to a working days-since counter. Work top to bottom and check things off as you go.</p>' +
      '<div class="overall"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + count + "/" + total + " · " + pct + "%</span></div></header>" +
      '<div class="decision"><b>Build decision: v1 stays on the original board</b><p>The board already has the display, LED drivers, and keypad laid out properly. ' +
      "Keep the PIC where it is, add an RTC module for time, and save a custom single-board design for v2 with a fresh chip.</p></div>" +
      html +
      '<p class="foot' + (saveError ? " err" : "") + '">' + (saveError ? esc(saveError) : updated ? "Saved on this Mac · " + esc(updated) : "No progress saved yet") + "</p>";
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      api().save_progress(done).then(function (r) {
        updated = r.updated; saveError = ""; render();
      }).catch(function () {
        saveError = "Couldn't save progress. Check that your disk isn't full, then try again."; render();
      });
    }, 300);
  }

  app.addEventListener("change", function (e) {
    var id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    if (e.target.checked) done[id] = true; else delete done[id];
    render();
    var again = document.getElementById("cb-" + id);
    if (again) again.focus();
    save();
  });

  function init() {
    api().load_state().then(function (s) {
      phases = s.phases; done = s.done || {}; updated = s.updated || ""; render();
    });
  }

  if (api()) init(); else window.addEventListener("pywebviewready", init);
})();
</script>
</body>
</html>
